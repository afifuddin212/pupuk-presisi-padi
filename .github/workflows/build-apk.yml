name: Build Android APK & AAB Bundle

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

concurrency:
  group: 'android-build'
  cancel-in-progress: true

env:
  ACTIONS_RUNNER_FORCE_NODE24: 'true'

jobs:
  build-android:
    name: Build APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Android SDK Environment & Platforms
        run: |
          sudo chmod -R 777 "$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "Accepting licenses..."
          yes | "$SDKMANAGER" --licenses || true
          echo "Installing Android SDK platforms and build-tools..."
          "$SDKMANAGER" "platforms;android-36" "platforms;android-35" "platforms;android-34" "build-tools;35.0.0" || true
          "$SDKMANAGER" "build-tools;36.0.0" || true

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK (Ready for Device Sideloading)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release Bundle (AAB for Google Play Store)
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Build Release APK (Unsigned)
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace || true

      - name: List Generated Build Outputs
        run: |
          echo "=== Build Outputs in android/app/build/outputs ==="
          find android/app/build/outputs -type f || true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pupuk-presisi-padi-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release AAB (Google Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: pupuk-presisi-padi-playstore-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
