name: Build Android APK & AAB Bundle

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'package.json'
      - 'capacitor.config.ts'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

concurrency:
  group: 'android-build'
  cancel-in-progress: true

env:
  ACTIONS_RUNNER_FORCE_NODE24: 'true'

jobs:
  build-android:
    name: Build APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Android SDK Environment & Platform 35
        run: |
          sudo chmod -R 777 "$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "Accepting licenses..."
          yes | "$SDKMANAGER" --licenses || true
          echo "Installing platforms;android-35 and build-tools;35.0.0..."
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Debug APK (Ready for Device Sideloading)
        id: build_debug
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee ../gradle_debug.log
        continue-on-error: true

      - name: Verify Debug Build
        if: steps.build_debug.outcome != 'success'
        run: |
          echo "::error::Gradle assembleDebug failed. Printing error log summary:"
          tail -n 120 gradle_debug.log
          exit 1

      - name: Build Release Bundle (AAB for Google Play Store)
        id: build_bundle
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon --stacktrace 2>&1 | tee ../gradle_bundle.log
        continue-on-error: true

      - name: Verify Bundle Build
        if: steps.build_bundle.outcome != 'success'
        run: |
          echo "::error::Gradle bundleRelease failed. Printing error log summary:"
          tail -n 120 gradle_bundle.log
          exit 1

      - name: Build Release APK (Unsigned)
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace || true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pupuk-presisi-padi-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release AAB (Google Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: pupuk-presisi-padi-playstore-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn
          retention-days: 30
