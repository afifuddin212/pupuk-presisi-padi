<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gradien Latar Belakang Hijau -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1EB954" />
      <stop offset="100%" stop-color="#0E8A38" />
    </linearGradient>

    <!-- Gradien Bulir Padi Emas -->
    <linearGradient id="grainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE033" />
      <stop offset="55%" stop-color="#F7B500" />
      <stop offset="100%" stop-color="#D98A00" />
    </linearGradient>

    <!-- Gradien Tangkai Padi -->
    <linearGradient id="stemGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A8DF48" />
      <stop offset="50%" stop-color="#E7F15C" />
      <stop offset="100%" stop-color="#F9D43A" />
    </linearGradient>

    <!-- Gradien Daun Hijau Terang -->
    <linearGradient id="leafLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A8E635" />
      <stop offset="100%" stop-color="#5EB824" />
    </linearGradient>

    <!-- Gradien Daun Hijau Gelap (Bayangan/Lipatan) -->
    <linearGradient id="leafDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#76C92B" />
      <stop offset="100%" stop-color="#3A8E1B" />
    </linearGradient>

    <!-- Bayangan Lembut untuk Pin Lokasi & Elemen -->
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#064D1E" flood-opacity="0.35" />
    </filter>
    <filter id="grainShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#075822" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- 1. Latar Belakang Squircle (Ikon Aplikasi) -->
  <rect x="0" y="0" width="512" height="512" rx="115" ry="115" fill="url(#bgGrad)" />

  <!-- 2. Elemen Dekoratif Radar / Orbit & Garis Lahan Sawah -->
  <g opacity="0.25">
    <!-- Lingkaran Putus-putus Luar -->
    <circle cx="256" cy="256" r="160" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-dasharray="10 14" stroke-linecap="round" />
    <!-- Lingkaran Solid Dalam -->
    <circle cx="256" cy="256" r="112" fill="none" stroke="#FFFFFF" stroke-width="5" />
    <!-- Garis Kontur Sawah -->
    <path d="M 55 375 Q 256 345 457 405" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
    <path d="M 35 425 Q 256 390 477 450" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- 3. Daun Padi Melengkung -->
  <g filter="url(#dropShadow)">
    <!-- Daun Kiri Bawah (Menjuntai ke Kiri) -->
    <path d="M 205 402 C 135 375, 115 315, 75 315 C 62 315, 55 328, 52 342 C 62 326, 78 324, 96 334 C 128 352, 148 395, 205 402 Z" fill="url(#leafLight)" />
    <path d="M 205 402 C 155 385, 132 345, 96 334 C 122 355, 145 390, 205 402 Z" fill="url(#leafDark)" />

    <!-- Daun Kiri Tegak (Tinggi ke Atas Kiri) -->
    <path d="M 202 398 C 145 335, 118 245, 138 162 C 122 238, 128 332, 196 402 Z" fill="url(#leafLight)" />
    <path d="M 202 398 C 158 330, 136 245, 138 162 C 146 242, 168 325, 205 396 Z" fill="url(#leafDark)" />

    <!-- Daun Kanan Melengkung (Membentuk Huruf P / Arch) -->
    <path d="M 208 395 C 185 310, 215 245, 272 248 C 296 249, 312 264, 318 282 C 306 266, 286 258, 265 262 C 218 270, 202 325, 214 395 Z" fill="url(#leafLight)" />
    <path d="M 208 395 C 196 320, 222 268, 265 262 C 232 275, 210 325, 214 395 Z" fill="url(#leafDark)" />
  </g>

  <!-- 4. Tangkai Padi Utama & Cabang Sekunder -->
  <g stroke="url(#stemGrad)" stroke-linecap="round" fill="none">
    <!-- Tangkai Utama (Lebih Tebal dan Merunduk Landai ke Kanan) -->
    <path d="M 206 396 C 175 270, 195 135, 290 105 C 365 82, 412 145, 426 225" stroke-width="6.5" />
    <!-- Tangkai Cabang (Lebih Kecil di Bagian Dalam Lengkungan) -->
    <path d="M 192 275 C 195 205, 235 162, 295 168 C 335 172, 355 205, 362 242" stroke-width="4.5" />
  </g>

  <!-- 5. Bulir-Bulir Padi (Gabah) -->
  <g filter="url(#grainShadow)" fill="url(#grainGrad)">
    <!-- === TANGKAI UTAMA (Sisi Luar / Atas) === -->
    <ellipse cx="212" cy="112" rx="22" ry="12" transform="rotate(-62 212 112)" />
    <ellipse cx="242" cy="92" rx="23" ry="12.5" transform="rotate(-42 242 92)" />
    <ellipse cx="280" cy="82" rx="24" ry="13" transform="rotate(-22 280 82)" />
    <ellipse cx="320" cy="85" rx="24" ry="13" transform="rotate(-2 320 85)" />
    <ellipse cx="358" cy="100" rx="23" ry="12.5" transform="rotate(20 358 100)" />
    <ellipse cx="390" cy="126" rx="22" ry="12" transform="rotate(42 390 126)" />
    <ellipse cx="414" cy="160" rx="21" ry="11.5" transform="rotate(62 414 160)" />
    <ellipse cx="428" cy="198" rx="20" ry="11" transform="rotate(78 428 198)" />

    <!-- === TANGKAI UTAMA (Sisi Dalam / Bawah) === -->
    <ellipse cx="236" cy="134" rx="22" ry="12" transform="rotate(-12 236 134)" />
    <ellipse cx="272" cy="122" rx="23" ry="12.5" transform="rotate(8 272 122)" />
    <ellipse cx="310" cy="124" rx="23" ry="12.5" transform="rotate(28 310 124)" />
    <ellipse cx="346" cy="138" rx="22" ry="12" transform="rotate(48 346 138)" />
    <ellipse cx="376" cy="162" rx="21" ry="11.5" transform="rotate(66 376 162)" />
    <ellipse cx="398" cy="194" rx="20" ry="11" transform="rotate(82 398 194)" />
    <!-- Bulir Ujung Tangkai Utama -->
    <ellipse cx="426" cy="238" rx="21" ry="11" transform="rotate(88 426 238)" />

    <!-- === TANGKAI CABANG (Sisi Atas) === -->
    <ellipse cx="234" cy="172" rx="16" ry="8.5" transform="rotate(-48 234 172)" />
    <ellipse cx="258" cy="158" rx="16.5" ry="9" transform="rotate(-26 258 158)" />
    <ellipse cx="285" cy="154" rx="16.5" ry="9" transform="rotate(-4 285 154)" />
    <ellipse cx="312" cy="160" rx="16" ry="8.5" transform="rotate(18 312 160)" />
    <ellipse cx="335" cy="175" rx="15.5" ry="8" transform="rotate(40 335 175)" />
    <ellipse cx="352" cy="196" rx="15" ry="8" transform="rotate(60 352 196)" />

    <!-- === TANGKAI CABANG (Sisi Bawah) === -->
    <ellipse cx="250" cy="186" rx="16" ry="8.5" transform="rotate(12 250 186)" />
    <ellipse cx="276" cy="184" rx="16.5" ry="9" transform="rotate(28 276 184)" />
    <ellipse cx="302" cy="190" rx="16" ry="8.5" transform="rotate(46 302 190)" />
    <ellipse cx="324" cy="204" rx="15.5" ry="8" transform="rotate(64 324 204)" />
    <ellipse cx="340" cy="224" rx="15" ry="7.5" transform="rotate(78 340 224)" />
    <!-- Bulir Ujung Tangkai Cabang -->
    <ellipse cx="360" cy="244" rx="15" ry="7.5" transform="rotate(84 360 244)" />
  </g>

  <!-- 6. Pin Lokasi GPS (Bagian Bawah) -->
  <g filter="url(#dropShadow)">
    <!-- Badan Pin Putih -->
    <path d="M 256 364 C 221 364 194 391 194 425 C 194 464 256 502 256 502 C 256 502 318 464 318 425 C 318 391 291 364 256 364 Z" fill="#FFFFFF" />
    <!-- Cincin Hijau Tengah -->
    <circle cx="256" cy="422" r="22" fill="#13A145" />
    <!-- Titik Kuning Pusat -->
    <circle cx="256" cy="422" r="10.5" fill="#FBC014" />
  </g>
</svg>